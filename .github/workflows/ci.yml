name: Python CI (uv)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies (including dev group)
        run: uv sync --python ${{ matrix.python-version }} --group dev

      - name: Lint with flake8
        run: |
          # Fail the build on syntax errors or undefined names
          uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Full lint, but only as warnings (won't fail the build)
          uv run flake8 . --count --exit-zero --statistics

      - name: Run tests with pytest
        run: uv run pytest --maxfail=1 --disable-warnings -q

  pr-review:
    needs: build-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync reviewer dependencies
        run: uv sync --python 3.12 --group review

      - name: Run custom PR reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.COHERE_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: uv run python scripts/pr_reviewer.py
