[project]
name = "simple-calculator"
version = "0.1.0"
description = "A simple calculator with a tkinter UI"
readme = "README.md"
requires-python = ">=3.10,<3.13"


[project.scripts]
calculator = "calculator.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calculator"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
]
review = [
    "requests>=2.31",
    "cohere>=7.1.1",
]
